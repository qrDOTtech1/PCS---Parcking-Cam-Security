<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ParkingCamSecurity (PCS) - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%); min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-sm">
        <div class="bg-white/10 backdrop-blur-md border border-white/20 rounded-2xl p-8 shadow-2xl">

            <div class="text-center mb-8">
                <img src="/static/img/PCS_wordmark_logo.svg" alt="ParkingCamSecurity" class="h-14 w-auto mx-auto mb-3 brightness-0 invert">
                <p class="text-blue-200 text-sm">Parking Security System</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="mb-4 text-sm text-center p-3 rounded-lg {% if category == 'error' %}bg-red-500/20 text-red-200 border border-red-500/30{% else %}bg-green-500/20 text-green-200 border border-green-500/30{% endif %}">
                      {{ message }}
                  </div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form method="POST" class="space-y-4">
                <div>
                    <label class="block text-white/70 text-sm font-medium mb-1">Username</label>
                    <input type="text" name="username" placeholder="Identifier" required autofocus
                        class="w-full px-4 py-3 rounded-xl border border-white/20 bg-white/10 text-white placeholder-white/30 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent transition">
                </div>
                <div>
                    <label class="block text-white/70 text-sm font-medium mb-1">Password</label>
                    <input type="password" name="password" placeholder="Password" required
                        class="w-full px-4 py-3 rounded-xl border border-white/20 bg-white/10 text-white placeholder-white/30 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent transition">
                </div>
                <button type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl transition shadow-lg">
                    Login
                </button>
            </form>

            <div class="mt-6 pt-6 border-t border-white/10 text-center">
                <p class="text-white/40 text-xs mb-3">Want to stream from your phone or webcam?</p>
                <a href="/setup"
                    class="flex items-center justify-center gap-2 w-full bg-white/10 hover:bg-white/20 border border-white/20 text-white font-medium py-2.5 rounded-xl transition text-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                    </svg>
                    Create a Camera
                </a>
            </div>

            <p class="text-center text-white/30 text-xs mt-6">ParkingCamSecurity &copy; 2024</p>
        </div>
    </div>

</body>
</html>
